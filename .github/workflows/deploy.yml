# Deploys the guest app to GitHub Pages (same setup as the anxiety toolkit).
# Tests and the privacy scan must pass before anything is published.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main, claude/wedding-guest-app]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Unit tests
        run: npm test
      - name: Build (served from /weddingapp/)
        run: npm run build:pages
      - name: Privacy scan (vault must be ciphertext only)
        run: npm run scan:bundle
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
